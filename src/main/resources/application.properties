spring.application.name=my-monday

# MongoDB (in locale: docker compose up -d)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mymonday}
spring.data.mongodb.auto-index-creation=true

# JWT: in produzione impostare APP_JWT_SECRET (almeno 32 caratteri casuali)
app.jwt.secret=${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
app.jwt.expiration=12h

# Amministratore creato al primo avvio se non esistono utenti
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin1234}
app.admin.display-name=Amministratore

# Errori API in formato RFC 9457: il campo "detail" contiene il messaggio mostrato nell'interfaccia
spring.mvc.problemdetails.enabled=true

# Import da monday.com: token API opzionale lato server (altrimenti va inserito nella pagina Import)
app.monday.token=${MONDAY_API_TOKEN:}

# Allegati dei task
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Client su altre origini (es. app Flutter avviata nel browser in sviluppo)
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
